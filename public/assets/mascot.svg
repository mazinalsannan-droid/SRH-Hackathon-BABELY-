<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Babbly, a bubble mail carrier">
  <defs>
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#FFF1C9"/>
      <stop offset="0.45" stop-color="#F3C566"/>
      <stop offset="0.85" stop-color="#D99A35"/>
      <stop offset="1" stop-color="#B9792A"/>
    </radialGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3B5E"/>
      <stop offset="1" stop-color="#18213A"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3A2A"/>
      <stop offset="1" stop-color="#2E2318"/>
    </linearGradient>
    <clipPath id="inside"><circle cx="256" cy="282" r="146"/></clipPath>
  </defs>

  <!-- little bubbles -->
  <g fill="#FFF6E0" fill-opacity=".35" stroke="#E2B25A" stroke-width="4">
    <circle cx="96" cy="356" r="22"/>
    <circle cx="70" cy="300" r="11"/>
    <circle cx="428" cy="196" r="17"/>
    <circle cx="452" cy="238" r="9"/>
    <circle cx="410" cy="420" r="13"/>
    <circle cx="126" cy="430" r="9"/>
  </g>

  <!-- body bubble -->
  <circle cx="256" cy="282" r="150" fill="url(#body)" stroke="#8C5A1E" stroke-width="7"/>

  <g clip-path="url(#inside)">
    <!-- faint hexagons, like the Library -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3">
      <path d="M352 214l17 -10 17 10v20l-17 10-17-10z"/>
      <path d="M369 244l17 -10 17 10v20l-17 10-17-10z"/>
      <path d="M335 244l17 -10 17 10v20l-17 10-17-10z"/>
    </g>
    <!-- coat with collar -->
    <path d="M150 440c8-52 52-80 106-80s98 28 106 80z" fill="url(#coat)"/>
    <path d="M222 366l34 30 34-30" fill="none" stroke="#6B5640" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="256" cy="414" r="6" fill="#E2B25A"/>
    <!-- satchel strap -->
    <path d="M196 372l140 70" stroke="#7A4E22" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- glossy sheen -->
  <ellipse cx="196" cy="196" rx="62" ry="34" fill="url(#sheen)" transform="rotate(-28 196 196)"/>
  <circle cx="340" cy="372" r="10" fill="#fff" fill-opacity=".5"/>

  <!-- blush -->
  <ellipse cx="180" cy="322" rx="20" ry="11" fill="#F08A6A" fill-opacity=".35"/>
  <ellipse cx="332" cy="322" rx="20" ry="11" fill="#F08A6A" fill-opacity=".35"/>

  <!-- eyes -->
  <g fill="#1B2440">
    <ellipse cx="215" cy="284" rx="17" ry="25"/>
    <ellipse cx="297" cy="284" rx="17" ry="25"/>
  </g>
  <g fill="#fff">
    <circle cx="221" cy="273" r="6"/>
    <circle cx="303" cy="273" r="6"/>
  </g>

  <!-- round glasses -->
  <g fill="#FFFFFF" fill-opacity=".12" stroke="#A86F22" stroke-width="7">
    <circle cx="213" cy="286" r="38"/>
    <circle cx="299" cy="286" r="38"/>
  </g>
  <path d="M251 282q5-7 10 0" fill="none" stroke="#A86F22" stroke-width="7" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M240 328q16 13 32 0" fill="none" stroke="#7A4E22" stroke-width="6" stroke-linecap="round"/>

  <!-- postman cap -->
  <g transform="rotate(-8 256 150)">
    <path d="M166 150c4-46 44-74 92-74s90 26 96 70c2 14-10 22-24 22H190c-14 0-25-8-24-18z" fill="url(#cap)"/>
    <path d="M150 168c30 14 182 14 214 0 10 10 4 26-12 30-50 12-140 12-190 0-16-4-22-20-12-30z" fill="#141B30"/>
    <rect x="236" y="104" width="44" height="32" rx="5" fill="#F3C566" stroke="#A86F22" stroke-width="3"/>
    <path d="M238 108l20 15 20-15" fill="none" stroke="#A86F22" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- letter held at the side -->
  <g transform="rotate(14 382 330)">
    <rect x="352" y="306" width="62" height="44" rx="6" fill="#FFF8EA" stroke="#8C5A1E" stroke-width="5"/>
    <path d="M356 312l27 20 27-20" fill="none" stroke="#8C5A1E" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="383" cy="340" r="5" fill="#C0392B"/>
  </g>
</svg>
